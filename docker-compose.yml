services:
  postgres:
    image: postgres:16
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  neo4j:
    image: neo4j:5
    # Deliberately NOT env_file: .env — the official image treats every
    # NEO4J_* variable (other than NEO4J_AUTH) as a dbms config setting, so
    # blanket-loading .env injected our app's NEO4J_URI/USER/PASSWORD as
    # unrecognized settings and crashed the container on startup with
    # strict_validation errors. Pass only what Neo4j itself needs.
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD}
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  api:
    build: .
    env_file: .env
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/code
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_started
      redis:
        condition: service_started

  mock_target:
    build: ./mock_leaky_service
    ports:
      - "8443:443"

  frontend:
    build:
      context: ./frontend
      target: development
    environment:
      VITE_API_PROXY_TARGET: http://api:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - api

  # Static production build served by nginx — not started by `docker compose
  # up` by default (profile "prod"). Run explicitly:
  #   docker compose --profile prod up --build frontend-prod
  # Dashboard then at http://localhost:5174 (separate port from the dev
  # server on 5173, so both can run side by side without colliding).
  frontend-prod:
    build:
      context: ./frontend
      target: production
    ports:
      - "5174:80"
    depends_on:
      - api
    profiles:
      - prod

  worker:
    build: .
    env_file: .env
    command: celery -A app.workers.celery_app worker --loglevel=info
    volumes:
      - .:/code
    depends_on:
      - api
      - redis

volumes:
  postgres_data:
  neo4j_data:
