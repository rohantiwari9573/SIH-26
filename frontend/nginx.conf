server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Proxied server-side (not via Vite's dev proxy, which doesn't exist in
    # this build) so the same relative /api/... calls in src/api.ts work
    # unchanged in both dev and production.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback: unknown paths serve index.html so client-side state
    # (not currently a router, but this is the standard-safe default) doesn't
    # 404 on a hard refresh.
    location / {
        try_files $uri /index.html;
    }
}
